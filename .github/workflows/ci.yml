# 代码检查：push 到 main、PR 到 main 时运行。
#
# 发布流程（.github/workflows/publish.yml）只在 tag 上运行，检查项统一放在这里，
# 避免两处维护同一套语法检查与 smoke test。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26
          package-manager-cache: false

      - name: Print Node.js and npm versions
        run: |
          node -v
          npm -v
          openssl version

      - name: Check syntax
        run: for file in src/*.js; do node --check "$file"; done

      - name: Smoke test CLI
        run: |
          node src/publish-apk.js --version
          node src/publish-apk.js cert --help > /dev/null
          node src/publish-apk.js profile --help > /dev/null
          node src/publish-apk.js hap --help > /dev/null
          node src/publish-apk.js app --help > /dev/null
          node src/publish-apk.js apk --help > /dev/null
          node src/publish-apk.js huawei --help > /dev/null
          node src/publish-apk.js huawei service-account --help > /dev/null
          node src/publish-apk.js huawei service-account-upload-url --help > /dev/null
          node src/publish-apk.js huawei service-account-upload-file --help > /dev/null
          node src/publish-apk.js huawei service-account-upload-file-package-info-update --help > /dev/null
          node src/publish-apk.js huawei client-credentials --help > /dev/null
          node src/publish-apk.js huawei client-credentials-upload-url --help > /dev/null
          node src/publish-apk.js huawei client-credentials-upload-file --help > /dev/null
          node src/publish-apk.js huawei client-credentials-upload-file-package-info-update --help > /dev/null
          node src/publish-apk.js huawei signing-config --help > /dev/null
          node src/publish-apk.js google --help > /dev/null
          node src/publish-apk.js google access-token --help > /dev/null
          node src/publish-apk.js google upload-aab --help > /dev/null
          node src/publish-apk.js help > /dev/null

      - name: Smoke test file commands
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT

          # 自签名证书：cert 的 PEM 输入
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -subj '/CN=smoke.test' -keyout "$tmp/key.pem" -out "$tmp/cert.pem"

          node src/publish-apk.js cert --file "$tmp/cert.pem" > "$tmp/cert.txt"
          grep -q '^证书数量: 1$' "$tmp/cert.txt"

          # 用同一套证书生成 PKCS#12：cert 的 .p12 输入
          openssl pkcs12 -export -in "$tmp/cert.pem" -inkey "$tmp/key.pem" \
            -name smoke -out "$tmp/storeFile.p12" -passout pass:smoke

          node src/publish-apk.js cert --file "$tmp/storeFile.p12" --password smoke > "$tmp/p12.txt"
          grep -q '^别名: smoke$' "$tmp/p12.txt"

          # 用 OpenSSL CMS 生成一个最小 P7B profile：profile 的输入
          cat > "$tmp/profile.json" <<'JSON'
          {"version-name":"1.0.0","version-code":1,"type":"debug","issuer":"smoke","bundle-info":{"bundle-name":"com.example.smoke","developer-id":"1","app-identifier":"2"},"validity":{"not-before":1893456000,"not-after":1924992000},"debug-info":{"device-ids":[],"device-id-type":"udid"},"permissions":{},"acls":{"allowed-acls":[]},"app-privilege-capabilities":[],"app-services-capabilities":{}}
          JSON
          openssl cms -sign -binary -nodetach -in "$tmp/profile.json" \
            -signer "$tmp/cert.pem" -inkey "$tmp/key.pem" -outform DER -out "$tmp/profile.p7b"

          node src/publish-apk.js profile --file "$tmp/profile.p7b" > "$tmp/profile.txt"
          grep -q '^Bundle: com.example.smoke$' "$tmp/profile.txt"

          # HAP：Python 生成最小 ZIP，验证 pack.info / module.json 与签名状态
          python3 - "$tmp/smoke.hap" <<'PY'
          import json
          import sys
          import zipfile

          module = {
              "app": {
                  "bundleName": "com.example.smoke",
                  "versionName": "1.0.0",
                  "versionCode": 1,
                  "bundleType": "app",
                  "debug": False,
                  "buildMode": "release",
                  "minAPIVersion": 10,
                  "targetAPIVersion": 26,
                  "apiReleaseType": "Release",
                  "vendor": "smoke",
                  "label": "$string:app_name",
                  "compileSdkVersion": "5.0.0",
                  "compileSdkType": "HarmonyOS",
              },
              "module": {
                  "name": "entry",
                  "type": "entry",
                  "deviceTypes": ["phone"],
                  "mainElement": "EntryAbility",
                  "deliveryWithInstall": True,
                  "installationFree": False,
                  "abilities": [{"name": "EntryAbility"}],
                  "requestPermissions": [{"name": "ohos.permission.INTERNET"}],
                  "pages": "$profile:main_pages",
              },
          }
          pack = {
              "summary": {
                  "app": {
                      "bundleName": "com.example.smoke",
                      "bundleType": "app",
                      "version": {"code": 1, "name": "1.0.0", "build": "1"},
                  },
                  "modules": [{
                      "mainAbility": "EntryAbility",
                      "deviceType": ["phone"],
                      "abilities": [{"name": "EntryAbility"}],
                      "distro": {
                          "moduleType": "entry",
                          "installationFree": False,
                          "deliveryWithInstall": True,
                          "moduleName": "entry",
                      },
                      "apiVersion": {"compatible": 10, "releaseType": "Release", "target": 26},
                  }],
              },
              "packages": [{
                  "deviceType": ["phone"],
                  "moduleType": "entry",
                  "deliveryWithInstall": True,
                  "name": "entry-default",
              }],
          }
          with zipfile.ZipFile(sys.argv[1], "w", zipfile.ZIP_DEFLATED) as archive:
              archive.writestr("module.json", json.dumps(module))
              archive.writestr("pack.info", json.dumps(pack))
              archive.writestr("resources/rawfile/smoke.txt", "smoke" * 100)
          PY

          node src/publish-apk.js hap --file "$tmp/smoke.hap" > "$tmp/hap.txt"
          grep -q '^包名: com.example.smoke$' "$tmp/hap.txt"
          grep -q '^版本: 1.0.0 (1)$' "$tmp/hap.txt"
          grep -q '^签名: 未签名' "$tmp/hap.txt"
          grep -q '^API 原始值: min 10 / target 26（compileSdk 5.0.0）$' "$tmp/hap.txt"
          grep -q '^构建: debug=false, buildMode=release, bundleType=app$' "$tmp/hap.txt"
          node src/publish-apk.js hap --file "$tmp/smoke.hap" --verbose > /dev/null
          HAP_FILE="$tmp/smoke.hap" node src/publish-apk.js hap > /dev/null
          node src/publish-apk.js hap --file "$tmp/smoke.hap" "$tmp/smoke.hap" > "$tmp/hap-multi.txt"
          test "$(grep -c '^文件:' "$tmp/hap-multi.txt")" -eq 2

          # APP：外层 ZIP 内含 pac.json / pack.info / entry-default.hap
          python3 - "$tmp/smoke.app" "$tmp/smoke.hap" <<'PY'
          import json
          import sys
          import zipfile

          app, hap = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(hap) as archive:
              pack = json.loads(archive.read("pack.info"))
          with zipfile.ZipFile(app, "w", zipfile.ZIP_DEFLATED) as archive:
              archive.writestr("pac.json", json.dumps({"dataProcess": [], "specialAPIs": []}))
              archive.writestr("pack.info", json.dumps(pack))
              archive.write(hap, "entry-default.hap")
          PY
          node src/publish-apk.js app --file "$tmp/smoke.app" > "$tmp/app.txt"
          grep -q '^格式: APP / ZIP（3 个条目）$' "$tmp/app.txt"
          grep -q '^包名: com.example.smoke$' "$tmp/app.txt"
          grep -q '^内层模块: entry-default.hap' "$tmp/app.txt"
          grep -q '^pac.json: 数据处理 0 项、特殊 API 0 项$' "$tmp/app.txt"
          grep -q '^签名: 未签名' "$tmp/app.txt"
          grep -q '^API 原始值: min 10 / target 26（compileSdk 5.0.0）$' "$tmp/app.txt"
          grep -q '^构建: debug=false, buildMode=release, bundleType=app$' "$tmp/app.txt"
          node src/publish-apk.js app --file "$tmp/smoke.app" --verbose > /dev/null
          APP_FILE="$tmp/smoke.app" node src/publish-apk.js app > /dev/null
          node src/publish-apk.js app --file "$tmp/smoke.app" "$tmp/smoke.app" > "$tmp/app-multi.txt"
          test "$(grep -c '^文件:' "$tmp/app-multi.txt")" -eq 2

          # signing-config：material 生成 + 两串密文口令；不依赖 JDK
          HARMONY_STORE_PASSWORD=smoke node src/publish-apk.js huawei signing-config \
            --store-file "$tmp/storeFile.p12" --certpath "$tmp/cert.pem" \
            --profile "$tmp/profile.p7b" --key-alias smoke --no-keytool \
            > "$tmp/signing.json"
          node -e '
            const fs = require("node:fs");
            const cfg = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (cfg.material.keyAlias !== "smoke") throw new Error("bad keyAlias");
            if (!/^[0-9a-f]+$/.test(cfg.material.storePassword)) throw new Error("bad storePassword");
            if (!/^[0-9a-f]+$/.test(cfg.material.keyPassword)) throw new Error("bad keyPassword");
          ' "$tmp/signing.json"
          test -d "$tmp/material"

          # 证书来自环境变量：PEM 内容
          HARMONY_STORE_PASSWORD=smoke HARMONY_CERTPATH="$(cat "$tmp/cert.pem")" \
            node src/publish-apk.js huawei signing-config \
            --store-file "$tmp/storeFile.p12" --profile "$tmp/profile.p7b" \
            --key-alias smoke --no-keytool --certpath-out "$tmp/cert-from-env.cer" \
            > "$tmp/signing-env.json"
          test -s "$tmp/cert-from-env.cer"
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const cfg = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (path.resolve(cfg.material.certpath) !== path.resolve(process.argv[2])) {
              throw new Error("certpath mismatch");
            }
          ' "$tmp/signing-env.json" "$tmp/cert-from-env.cer"

          # 证书来自环境变量：BASE64（DER）
          cert_b64="$(openssl x509 -in "$tmp/cert.pem" -outform DER | openssl base64 -A)"
          HARMONY_STORE_PASSWORD=smoke HARMONY_CERTPATH_BASE64="$cert_b64" \
            node src/publish-apk.js huawei signing-config \
            --store-file "$tmp/storeFile.p12" --profile "$tmp/profile.p7b" \
            --key-alias smoke --no-keytool --certpath-out "$tmp/cert-from-b64.cer" \
            > "$tmp/signing-b64.json"
          test -s "$tmp/cert-from-b64.cer"
          grep -q '^-----BEGIN CERTIFICATE-----' "$tmp/cert-from-b64.cer"

          # .p12 来自 BASE64（命令行），material 生成在 --store-file-out 同级
          store_b64="$(openssl base64 -A -in "$tmp/storeFile.p12")"
          mkdir -p "$tmp/b64"
          HARMONY_STORE_PASSWORD=smoke node src/publish-apk.js huawei signing-config \
            --store-file "$store_b64" --store-file-out "$tmp/b64/storeFile.p12" \
            --certpath "$tmp/cert.pem" --profile "$tmp/profile.p7b" \
            --key-alias smoke --no-keytool > "$tmp/signing-store-b64.json"
          test -s "$tmp/b64/storeFile.p12"
          test -d "$tmp/b64/material"
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const cfg = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (path.resolve(cfg.material.storeFile) !== path.resolve(process.argv[2])) {
              throw new Error("storeFile mismatch");
            }
          ' "$tmp/signing-store-b64.json" "$tmp/b64/storeFile.p12"

          # .p7b 来自 BASE64（命令行），写到 --profile-out，内容是 DER
          profile_b64="$(openssl base64 -A -in "$tmp/profile.p7b")"
          HARMONY_STORE_PASSWORD=smoke node src/publish-apk.js huawei signing-config \
            --store-file "$tmp/storeFile.p12" --certpath "$tmp/cert.pem" \
            --profile "$profile_b64" --profile-out "$tmp/profile-from-b64.p7b" \
            --key-alias smoke --no-keytool > "$tmp/signing-profile-b64.json"
          test -s "$tmp/profile-from-b64.p7b"
          test "$(od -An -tx1 -N1 "$tmp/profile-from-b64.p7b" | tr -d ' ')" = "30"
          node -e '
            const fs = require("node:fs");
            const path = require("node:path");
            const cfg = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
            if (path.resolve(cfg.material.profile) !== path.resolve(process.argv[2])) {
              throw new Error("profile mismatch");
            }
          ' "$tmp/signing-profile-b64.json" "$tmp/profile-from-b64.p7b"

          # --write：只更新同名 signingConfig 的 material
          printf '%s\n' '{"app":{"signingConfigs":[{"name":"default","type":"HarmonyOS","material":{}}]}}' \
            > "$tmp/build-profile.json5"
          HARMONY_STORE_PASSWORD=smoke node src/publish-apk.js huawei signing-config \
            --store-file "$tmp/storeFile.p12" --certpath "$tmp/cert.pem" \
            --profile "$tmp/profile.p7b" --key-alias smoke --no-keytool \
            --config "$tmp/build-profile.json5" --name default --write > /dev/null
          grep -q '"keyAlias": "smoke"' "$tmp/build-profile.json5"
