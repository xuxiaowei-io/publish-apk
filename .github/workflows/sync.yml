# 把 GitHub 仓库的所有分支、所有标签同步到 Gitee、CNB、GitLink、GitCode。
#
# 每次触发都做全量同步：分支与标签数量很少，一次推送全部 ref 比逐个判断事件里的
# ref 更简单，也不会因为事件合并、并发推送而漏同步；删除分支/标签同样靠全量同步传播。
#
# 四个平台通过 matrix 并行执行，fail-fast: false 让一个平台失败不影响其余平台。
# 单个平台同步失败时自动重试（默认最多 3 次，10s/20s 退避），
# 网络抖动或平台临时故障不会直接让整个同步失败。
#
# 需要在 Settings -> Secrets and variables -> Actions 中配置：
#   Secrets（令牌）：
#     GITEE_TOKEN     Gitee 私人令牌（projects 读写权限）
#     CNB_TOKEN       CNB 访问令牌
#     GITLINK_TOKEN   GitLink 访问令牌
#     GITCODE_TOKEN   GitCode 个人访问令牌（PAT）
#   Variables（可选，用户名）：
#     GITEE_USERNAME   默认 xuxiaowei-com-cn
#     GITLINK_USERNAME 默认 xuxiaowei
#     GITCODE_USERNAME 默认 qq_32596527
#   组织仓库的 HTTPS 推送账号是个人账号，不是组织名；账号名不同时用 Variable 覆盖。
#   CNB 的用户名固定为 cnb，无需配置。

name: Sync Mirrors

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  schedule:
    - cron: '37 19 * * *'  # 每天 03:37（Asia/Shanghai），校准镜像漂移
  workflow_dispatch:

permissions:
  contents: read

# 全量推送必须串行：并发运行时，先启动的运行可能删掉后启动运行刚推送的 ref
concurrency:
  group: sync-mirrors
  cancel-in-progress: false

jobs:
  sync:
    name: Sync to ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Gitee
            token_env: GITEE_TOKEN
            username_env: GITEE_USERNAME
            url: https://gitee.com/xuxiaowei-io/publish-apk.git
          - name: CNB
            token_env: CNB_TOKEN
            username_env: CNB_USERNAME
            url: https://cnb.cool/xuxiaowei.io/publish-apk.git
          - name: GitLink
            token_env: GITLINK_TOKEN
            username_env: GITLINK_USERNAME
            url: https://www.gitlink.org.cn/xuxiaowei-io/publish-apk.git
          - name: GitCode
            token_env: GITCODE_TOKEN
            username_env: GITCODE_USERNAME
            url: https://gitcode.com/xuxiaowei-io/publish-apk.git
    env:
      # matrix 不能直接引用 secrets，这里先全部注入，再按 *_env 取用
      GITEE_USERNAME: ${{ vars.GITEE_USERNAME || 'xuxiaowei-com-cn' }}
      GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
      CNB_USERNAME: cnb
      CNB_TOKEN: ${{ secrets.CNB_TOKEN }}
      GITLINK_USERNAME: ${{ vars.GITLINK_USERNAME || 'xuxiaowei' }}
      GITLINK_TOKEN: ${{ secrets.GITLINK_TOKEN }}
      GITCODE_USERNAME: ${{ vars.GITCODE_USERNAME || 'qq_32596527' }}
      GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Sync branches and tags
        env:
          TARGET_NAME: ${{ matrix.name }}
          TOKEN_ENV: ${{ matrix.token_env }}
          USERNAME_ENV: ${{ matrix.username_env }}
          TARGET_URL: ${{ matrix.url }}
          SOURCE_TOKEN: ${{ github.token }}
          MAX_ATTEMPTS: 3
          RETRY_DELAY_SECONDS: 10
        run: |
          set -euo pipefail
          token="${!TOKEN_ENV:-}"
          if [ -z "$token" ]; then
            echo "::error::未配置 ${TOKEN_ENV}，无法同步到 ${TARGET_NAME}"
            exit 1
          fi
          username="${!USERNAME_ENV:-}"
          if [ -z "$username" ]; then
            echo "::error::未配置 ${USERNAME_ENV}，无法同步到 ${TARGET_NAME}"
            exit 1
          fi
          # 全量同步是幂等的，失败后直接重跑；每次重试都会重新克隆最新状态。
          for attempt in $(seq 1 "$MAX_ATTEMPTS"); do
            if TARGET_USERNAME="$username" TARGET_TOKEN="$token" \
              bash .github/scripts/sync-mirror.sh \
                "https://github.com/${GITHUB_REPOSITORY}.git" \
                "$TARGET_URL"; then
              exit 0
            fi
            if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
              delay=$((RETRY_DELAY_SECONDS * attempt))
              echo "::warning::同步到 ${TARGET_NAME} 第 ${attempt} 次失败，${delay} 秒后重试"
              sleep "$delay"
            fi
          done
          echo "::error::同步到 ${TARGET_NAME} 失败，已尝试 ${MAX_ATTEMPTS} 次"
          exit 1
